name: NutriSnap CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff pytest
        
    - name: Lint with ruff
      run: |
        cd backend
        ruff check .
        
    - name: Test with pytest
      run: |
        cd backend
        # Skip ML tests that require weights in CI
        pytest tests/ --ignore=tests/test_model.py 

  frontend-lint-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Lint
      run: |
        cd frontend
        npm run lint || true # Don't fail if linting isn't fully configured
        
    - name: Build
      run: |
        cd frontend
        npm run build
