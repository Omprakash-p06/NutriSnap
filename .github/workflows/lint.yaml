name: Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort flake8 mypy

      - name: Check formatting with black
        run: black backend/app/ backend/nutrisnap/ backend/tests/ backend/scripts/ --check --diff

      - name: Check import ordering with isort
        run: isort backend/app/ backend/nutrisnap/ backend/tests/ backend/scripts/ --check-only --diff

      - name: Lint with ruff
        run: |
          cd backend
          ruff check .

      - name: Lint with flake8
        run: flake8 backend/app/ backend/nutrisnap/ backend/tests/ backend/scripts/

      - name: Type check with mypy
        run: mypy backend/app/ backend/nutrisnap/ --ignore-missing-imports
        continue-on-error: true
