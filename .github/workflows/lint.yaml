name: Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8 mypy

      - name: Check formatting with black
        run: black src/ tests/ scripts/ --check --diff

      - name: Check import ordering with isort
        run: isort src/ tests/ scripts/ --check-only --diff

      - name: Lint with flake8
        run: flake8 src/ tests/ scripts/ --max-line-length=88 --extend-ignore=E203,W503

      - name: Type check with mypy
        run: mypy src/ --ignore-missing-imports
        continue-on-error: true  # mypy failures are non-blocking in Phase 1
