name: Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install ruff black isort flake8 mypy
          # Install requirements to help mypy if needed, 
          # but for linting we usually don't need full env
          # pip install -r requirements.txt 

      - name: Check formatting with black
        run: |
          cd backend
          black app/ nutrisnap/ tests/ scripts/ --check --diff

      - name: Check import ordering with isort
        run: |
          cd backend
          isort app/ nutrisnap/ tests/ scripts/ --check-only --diff

      - name: Lint with ruff
        run: |
          cd backend
          ruff check .

      - name: Lint with flake8
        run: |
          cd backend
          flake8 app/ nutrisnap/ tests/ scripts/

      - name: Type check with mypy
        run: |
          cd backend
          mypy app/ nutrisnap/ --ignore-missing-imports
        continue-on-error: true
