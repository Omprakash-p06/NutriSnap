<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="white" />
  
  <!-- Nodes -->
  <g font-family="Arial, sans-serif" font-size="14" text-anchor="middle">
    <!-- Input -->
    <rect x="300" y="20" width="200" height="40" rx="10" fill="#E1F5FE" stroke="#01579B" />
    <text x="400" y="45">Input Image</text>
    
    <!-- YOLOv5 -->
    <rect x="300" y="100" width="200" height="40" rx="10" fill="#FFF9C4" stroke="#FBC02D" />
    <text x="400" y="125">YOLOv5 Detection</text>
    
    <!-- Crops -->
    <rect x="300" y="180" width="200" height="40" rx="10" fill="#FFF9C4" stroke="#FBC02D" />
    <text x="400" y="205">Food Item Cropping</text>
    
    <!-- Pipeline Group -->
    <rect x="50" y="260" width="700" height="120" rx="10" fill="#F3E5F5" stroke="#7B1FA2" stroke-dasharray="5,5" />
    <text x="150" y="280" font-weight="bold">Parallel Processing</text>
    
    <rect x="100" y="300" width="150" height="40" rx="5" fill="#E8EAF6" stroke="#3F51B5" />
    <text x="175" y="325">SAM 2 (Mask)</text>
    
    <rect x="325" y="300" width="150" height="40" rx="5" fill="#E8EAF6" stroke="#3F51B5" />
    <text x="400" y="325">GLPN (Depth)</text>
    
    <rect x="550" y="300" width="150" height="40" rx="5" fill="#E8EAF6" stroke="#3F51B5" />
    <text x="625" y="325">Volume Scalar</text>
    
    <!-- ViT -->
    <rect x="300" y="420" width="200" height="40" rx="10" fill="#E8F5E9" stroke="#2E7D32" />
    <text x="400" y="445">ViT Regression (Mass)</text>
    
    <!-- Gemini -->
    <rect x="300" y="500" width="200" height="40" rx="10" fill="#FCE4EC" stroke="#C2185B" />
    <text x="400" y="525">Gemini LLM Validation</text>
    
    <!-- Output -->
    <rect x="300" y="560" width="200" height="30" rx="5" fill="#ECEFF1" stroke="#455A64" />
    <text x="400" y="580">Final Nutrition & Advice</text>
  </g>
  
  <!-- Connectors -->
  <g stroke="#333" stroke-width="2" fill="none">
    <path d="M 400 60 L 400 100" />
    <path d="M 400 140 L 400 180" />
    <path d="M 400 220 L 400 260" />
    
    <path d="M 175 220 L 175 300" />
    <path d="M 400 220 L 400 300" />
    <path d="M 625 220 L 625 300" />
    
    <path d="M 175 340 L 175 400 L 400 400 L 400 420" />
    <path d="M 400 340 L 400 420" />
    <path d="M 625 340 L 625 400 L 400 400 L 400 420" />
    
    <path d="M 400 460 L 400 500" />
    <path d="M 400 540 L 400 560" />
  </g>
</svg>