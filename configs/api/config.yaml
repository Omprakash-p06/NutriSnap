# NutriSnap API Configuration
pipeline:
  segmenter_config: "configs/pipeline/segmenter.yaml"
  volume_config: "configs/pipeline/volume.yaml"
  validator_config: "configs/pipeline/validator.yaml"
  nutrition_predictor:
    checkpoint_dir: "models/checkpoints/ensemble_5fold_v1"
    model_config: "configs/models/efficientnet_v2_b0.yaml"
    num_folds: 5
  fallback:
    enabled: true
    model: "gemini-1.5-flash"
    prompt_path: "configs/pipeline/fallback_prompt.txt"

inference:
  max_latency: 2.0  # seconds
  gpu_serialization: true
  result_ttl_hours: 24

storage:
  db_path: "data/nutrisnap.db"
  upload_dir: "data/uploads"
